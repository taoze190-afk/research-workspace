# 1Panel 里给研序站点用的 Nginx 片段。
# 用法：1Panel → 网站 → 你的站点 → 配置文件，把下面 server{} 内的内容并进去
# （静态站点那部分 1Panel 已经生成，只需要补 /api 反代和安全头）。

# 前端静态文件：dist/ 整个目录传到服务器，网站根目录指向它
# 例如 /opt/1panel/www/sites/yanxu/index

# 反向代理到本机服务端
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 登录限速按 IP 计，服务端需要这一行且 TRUST_PROXY=1
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  60s;
    # 原文件上限25MiB，AI图片请求上限20MiB；留少量请求头/编码余量。
    client_max_body_size 32m;
}

# 单页应用：刷新 /projects/xxx 这类深链接时要回到 index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 备份文件可能含科研正文，绝不允许被站点直接下载
location /backup/ {
    deny all;
    return 404;
}

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
